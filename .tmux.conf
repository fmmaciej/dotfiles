######################################################################
# https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '/home/fm/.tmux/plugins/tpm/tpm'

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# To list avaiable terminfo - ls /usr/share/terminfo
set -g default-terminal "foot"

source-file ~/.tmux/themes/tmux-termed/termed.tmux

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vim
setw -g mode-keys vi

# address vim mode switching delay (http://superuser.com/a/252717/65504)
# Speeds up response after hitting ESC
set -s escape-time 0

# increase scrollback buffer size
set -g history-limit 50000

# decrease time of avaiable prefix action 
set -g repeat-time 100

# tmux messages are displayed for 1.5 seconds
set -g display-time 1500

# mouse support
set -g mouse on
# set -g mouse-resize-pane off

# don't rename windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# focus events enabled for terminals that support them
set -g focus-events on

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Panes synchronization
bind -r p setw synchronize-panes

# Respawn pane
bind q respawn-pane -k

bind g run "~/.config/env/tmux_change_directory_to_other_pane.sh"

# resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

bind v split-window -v
bind b split-window -h

bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-logging'

# Open urls in browser
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @urlview-key 'u'

# Should not break scrolling
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# This is really important to enable painless scrolling
# https://github.com/tmux/tmux/issues/1320
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Shared clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @custom_copy_command 'wl-copy'

# tmux-continuum dependency
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enabling restore tmux sessions
set -g @continuum-restore 'on'

# Enable automatic sta #[default],}rt with systemd
# set -g @continuum-boot 'on'

# Enable battery indicator
set -g @plugin 'tmux-plugins/tmux-battery'

# Sensible tmux settings
# set -g @plugin 'tmux-plugins/tmux-sensible'

# copy pasting in terminal with vimium/vimperator like hints.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F

# bind -r n next-window
# bind -r S-n previous-window

# buffer
# bind Space choose-buffer

# bind [ copy-mode
# bind P paste-buffer

# Use v to trigger selection in copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
# The copy-pipe command stores selected text in tmux buffer same to copy-selection, plus pipes selected text to the given command wl-copy
# So we get text stored in two places: the tmux copy buffer and the system clipboard.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    
