######################################################################
# https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '/home/fm/.tmux/plugins/tpm/tpm'

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."


# set -g default-terminal "tmux-256color"  # setting the correct term
# if other is used, then there will be a problem with cmd glithes
set -g default-terminal "alacritty"  # setting the correct term
source-file ~/.tmux/themes/tmux-sway/tomorrow-term.tmux

# source-file ~/.tmux/themes/tmux-sway/tomorrow-sway.tmux
# source-file ~/.tmux/themes/tmux-tomorrow/tomorrow-night-night.tmux

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vim
setw -g mode-keys vi

# address vim mode switching delay (http://superuser.com/a/252717/65504)
# Speeds up response after hitting ESC
set -s escape-time 0

# increase scrollback buffer size
set -g history-limit 50000

# decrease time of avaiable prefix action 
set-option -g repeat-time 100

# tmux messages are displayed for 2 seconds
set -g display-time 500

# mouse support
set -g mouse on
# set -g mouse-resize-pane off

# don't rename windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# focus events enabled for terminals that support them
set -g focus-events on

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Panes synchronization
# bind -r C-s setw synchronize-panes
bind -r p setw synchronize-panes

# Respawn pane
bind q respawn-pane -k

# resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

bind v split-window -v
bind b split-window -h

bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-logging'

# Open urls in browser
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @urlview-key 'u'

# Should not break scrolling
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Shared clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @custom_copy_command 'wl-copy'

# tmux-continuum dependency
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enabling restore tmux sessions
set -g @continuum-restore 'on'

# Enable automatic sta #[default],}rt with systemd
# set -g @continuum-boot 'on'

# Enable battery indicator
set -g @plugin 'tmux-plugins/tmux-battery'

# Sensible tmux settings
# set -g @plugin 'tmux-plugins/tmux-sensible'

# copy pasting in terminal with vimium/vimperator like hints.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F

