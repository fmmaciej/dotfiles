# THEME
#

# Truecolor + kształt kursora (bez duplikatów w innych modułach)
# Blokowy kursor w tmux
# 0 reset do domyślnego
# 1 blinking block
# 2 steady block (stały blok)
# 3 blinking underline
# 4 steady underline
# 5 blinking bar
# 6 steady bar (beam)
set -g default-terminal "tmux-256color"
set -as terminal-features 'tmux-256color:RGB'

# formaty, bez kolorów
source-file ~/.tmux/themes/vscode-dark-modern/skel.tmux

# kolory, nadpisują style, nie ruszają formatów
source-file ~/.tmux/themes/vscode-dark-modern/colors.tmux
