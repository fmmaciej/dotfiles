# THEME
#

# Truecolor + cursor shape support
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ',xterm*:Tc,Ss=\E[2 q:Se=\E[2 q'

# Status on and polling interval
set -g status on
set -g status-interval 15

# Use envs provided by WezTerm; fall back to VSCode values when not present
set -g @bg      '#{?env:THEME_BG,   #1e1e1e}'
set -g @fg      '#{?env:THEME_FG,   #d4d4d4}'
set -g @accent  '#{?env:THEME_ACCENT,#007acc}'
set -g @dimfg   '#{?env:THEME_DIM_FG,#858585}'
set -g @border  '#{?env:THEME_BORDER,#3c3c3c}'

# Status bar
set -g status-style "fg=#{@fg},bg=#{@bg}"

# Window titles
setw -g window-status-style "fg=#{@dimfg},bg=#{@bg}"
setw -g window-status-format " #I #W "

setw -g window-status-current-style "fg=#ffffff,bg=#{@accent},bold"
setw -g window-status-current-format " #I #W "

# Pane borders
set -g pane-border-style "fg=#{@border}"
set -g pane-active-border-style "fg=#{@accent}"

# Messages / copy-mode
set -g message-style "fg=#{@fg},bg=#252526"
set -g mode-style    "fg=#{@fg},bg=#252526"

# Right status (without plugins; adapt if you use tmux-battery)
set -g status-right "#[fg=#{@fg}] %d.%m.%Y %H:%M "

# Termed
if-shell "[ -r ~/.tmux/themes/tmux-termed/termed.tmux ]" \
  "source-file ~/.tmux/themes/tmux-termed/termed.tmux"

