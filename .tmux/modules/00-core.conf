# CORE
#

# Reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Blokowy kursor w tmux
# 0 reset do domyślnego
# 1 blinking block
# 2 steady block (stały blok)
# 3 blinking underline
# 4 steady underline
# 5 blinking bar
# 6 steady bar (beam)
set -ag terminal-overrides ',xterm*:Ss=\E[1 q:Se=\E[1 q'

# Tryb vi w copy-mode
setw -g mode-keys vi

# Szybka reakcja na ESC (Vim w tmux) – 0 jest ok w 2025
set -s escape-time 0

# Historia, powtórzenia, message timeout
set -g history-limit 50000
set -g repeat-time 100
set -g display-time 1500

# Mysz
set -g mouse on

# Nazwy okien niech nie skaczą
set -g allow-rename off
setw -g automatic-rename off

# Focus-events (użyteczne dla edytorów)
set -g focus-events on

# Agresywne dopasowanie rozmiaru okna (multi-monitor)
setw -g aggressive-resize on

# Prefix na C-a i kompatybilność
unbind C-b
set -g prefix C-a
bind C-a send-prefix

