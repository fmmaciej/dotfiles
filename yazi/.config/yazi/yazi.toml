# Yazi 26.9 configuration for a terminal-only WSL environment.
[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false

[opener]
edit = [
  { run = '${EDITOR:-vim} %s', block = true, for = "unix" },
]
open = [
  { run = 'wsl-open %s1', orphan = true, for = "linux" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { url = "*", use = ["open", "edit"] },
]
