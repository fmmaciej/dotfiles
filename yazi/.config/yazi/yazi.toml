# Native Windows configuration (Yazi 26.9+).

[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false

[opener]
edit = [
  { run = 'vim %s', for = "windows", block = true, desc = "Vim" },
]
open = [
  { run = 'start "" %s1', for = "windows", orphan = true, desc = "Open in Windows" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
]
