setw -g window-style 'bg=default'
setw -g window-active-style 'bg=default'
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 100
set -g status-right-length 100
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
set -g status-left "#[fg=#{@dimfg},bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=#{@accent}] PREFIX ,}#{?window_zoomed_flag,#[fg=#{@accent}] ZOOM ,}#{?pane_synchronized,#[fg=#{@accent}] SYNC ,}#[fg=#{@dimfg}]| #[fg=#{@fg}]#{?@battery_display,#{@battery_display} | ,}%d.%m.%Y | %H:%M:%S "
run-shell -b '~/.tmux/themes/vscode-dark-modern/colors.ps1'
