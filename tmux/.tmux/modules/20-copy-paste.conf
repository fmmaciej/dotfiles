# Native psmux copies to the Windows clipboard; no pbcopy or yank plugin.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind P run-shell "~/.tmux/scripts/paste.ps1 -Pane '#{pane_id}'"

# Preserve the Mac copy-mode half-page scrolling bindings.
bind -T copy-mode-vi S-PageUp send-keys -X halfpage-up
bind -T copy-mode-vi S-PageDown send-keys -X halfpage-down
