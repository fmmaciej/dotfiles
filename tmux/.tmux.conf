# Native psmux; keep the package/module layout shared with mac and wsl.
# Let psmux supply its PSReadLine/CWD initialization and load AllHosts normally.
# Do not append our own -Command: psmux already builds one for PowerShell panes.
set -g default-shell "pwsh.exe -ExecutionPolicy Bypass"

source-file ~/.tmux/modules/00-core.conf
source-file ~/.tmux/modules/10-keys.conf
source-file ~/.tmux/modules/20-copy-paste.conf
source-file ~/.tmux/modules/30-mouse.conf
source-file ~/.tmux/modules/60-theme.conf

# Keep declarations here: PPM scans the entry-point config, not sourced modules.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-logging'
# Rename changes the registry identity used by helpers; restart their context.
set-hook -g after-rename-session "run-shell -b '~/.tmux/scripts/startup.ps1'"
run-shell -b '~/.tmux/scripts/startup.ps1'
