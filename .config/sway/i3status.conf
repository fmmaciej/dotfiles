# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
	output_format = "i3bar"
        colors = true
        interval = 1
	color_good =     "#48f075"
	color_degraded = "#E5d075"
	color_bad =      "#E53975"
}

#order += "ipv6"
order += "disk /"
order += "disk /home"
order += "path_exists VPN"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "load"
order += "cpu_temperature 0"
# order += "cpu_temperature 1"
order += "tztime local"
order += "volume mic"
order += "volume master"

run_watch DHCP { pidfile = "/var/run/dhclient*.pid"
}

path_exists VPN {
# path exists when a VPN tunnel launched by nmcli/nm-applet is activated
    path = "/proc/sys/net/ipv4/conf/wg0"
}

wireless _first_ {
        format_up = "%essid %quality %ip" 
        format_down = ""
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        format_up = "%speed %ip "
        format_down = ""
}

battery all {
        format = "%status%percentage %remaining"
	format_down = "No battery"
	# last_full_capacity = true
	threshold_type = percentage
	low_threshold = 15
	integer_battery_capacity = true
	hide_seconds = true
	status_chr = ""
        status_bat = ""
        status_unk = " "
	status_full = ""
	# path = "/sys/class/power_suppply/BAT%d/uevent"
}

tztime local {
	align = center
        format = "%d.%m.%Y %H:%M:%S"
}

load {
        format = "%1min"
}

disk "/" {
        format = " %avail"
}

disk "/home" {
        format = " %avail"
}

volume master {
	format = " %volume"
	format_muted = " %volume"
	device = "sysdefault"
}

volume mic {
	format = ""
	format_muted = ""
	device = "default"
        mixer = "Master"
        mixer_idx = 0
	# device  = "pulse:alsa_output.pci-0000_00_1b.0.analog-stereo"
}

cpu_temperature 0{
        format = "%degrees°C"
	path="/sys/devices/platform/coretemp.0/hwmon/hwmon*/temp1_input"
	#path="/sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input"
        #path="/sys/devices/platform/coretemp.0/temp2_input"
        max_threshold=75
}

cpu_temperature 1{
        format = "%degrees °C"
        path="/sys/devices/platform/coretemp.0/temp3_input"
        max_threshold=75
}
